name: Bug report
description: Tell us about something that is not working
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what went wrong and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: Tell us what you did before the problem appeared.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Add screenshots, logs, or version details if useful. Remove private information first.
