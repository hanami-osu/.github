name: Bug report
description: Report a reproducible problem in a Hanami project
title: "[Bug] "
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is affected?
      options:
        - Hanami Bot
        - Hanami Web
        - osu!guessr
        - Hanami Companion
        - Shared infrastructure
        - Organization profile or other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant browser, operating system, application version, or deployment details.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials, tokens, personal data, and production configuration before attaching evidence.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed sensitive information from this report.
          required: true
