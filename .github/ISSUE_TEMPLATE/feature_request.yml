name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the change or new feature.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would it help?
      description: Add any context or examples that explain the idea.
